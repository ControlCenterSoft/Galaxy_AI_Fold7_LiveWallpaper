name: Build Galaxy AI v67.0 Natural Face Dynamics APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v67-natural-face-dynamics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v67 natural face dynamics contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/FloatingAssistantService.java').read_text()
          view = Path('app/src/main/java/pro/galaxyai/fold7/FloatingAssistantViewV67.java').read_text()
          dynamics = Path('app/src/main/java/pro/galaxyai/fold7/engine/NaturalFaceDynamicsV67.java').read_text()
          portrait = Path('app/src/main/java/pro/galaxyai/fold7/engine/DeformableLivePortraitV45.java').read_text()
          speech = Path('app/src/main/java/pro/galaxyai/fold7/engine/SpeechFaceSyncV41.java').read_text()
          state = Path('app/src/main/java/pro/galaxyai/fold7/ai/AIState.java').read_text()
          personality = Path('app/src/main/java/pro/galaxyai/fold7/ai/RussianAIPersonalityV33.java').read_text()
          gradle = Path('app/build.gradle').read_text()

          # Floating assistant remains the only active visual runtime.
          assert 'android.permission.SYSTEM_ALERT_WINDOW' in manifest
          assert 'FloatingAssistantService' in manifest
          assert 'BIND_WALLPAPER' not in manifest
          assert 'android.software.live_wallpaper' not in manifest
          assert 'GalaxyAIWallpaperService' not in manifest
          assert 'FloatingAssistantViewV67' in service
          assert 'TYPE_APPLICATION_OVERLAY' in service

          # v67 unified local face dynamics.
          assert 'NaturalFaceDynamicsV67' in view
          assert 'naturalFace.update' in view
          assert 'portrait.setGaze' in view
          assert 'portrait.setMouthOpen' in view
          assert 'portrait.setSpeechEnergy' in view
          assert 'naturalFace.onTouch' in view
          assert 'HeadEyeCoordinationV49' in dynamics
          assert 'AttentionGazeControllerV46' in dynamics
          assert 'updateMicrosaccade' in dynamics
          assert 'Deterministic irregular sequence' in dynamics
          assert 'mouthStiffness' in dynamics
          assert 'speechStiffness' in dynamics

          # Inherited maskless blink / expression / speech pipeline must remain intact.
          assert 'natural eyelid closure' in portrait
          assert 'MicroExpressionControllerV47' in portrait
          assert 'setGaze' in portrait
          assert 'setMouthOpen' in portrait
          assert 'Canvas' not in speech
          assert 'Paint' not in speech
          assert 'drawOval' not in speech
          assert 'drawPath' not in speech

          # Russian AI contract.
          assert '"locale"' in state
          assert 'RussianAIPersonalityV33.LOCALE_TAG' in state
          assert '"language"' in state
          assert 'LOCALE_TAG = "ru-RU"' in personality

          # Privacy contract.
          for forbidden in [
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.ACCESS_FINE_LOCATION'
          ]:
              assert forbidden not in manifest, forbidden

          assert "versionCode 670" in gradle
          assert "versionName '67.0'" in gradle
          assert 'Galaxy AI v67' in manifest
          PY

      - name: Verify inherited AIDI gateway stack compiles
        run: python3 -m py_compile aidi_gateway/*.py gateway_simulator/*.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v67.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify v67 APK metadata permissions signature and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Floating_Assistant_v67.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Floating_Assistant_v67.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='670'"
          echo "$BADGING" | grep -q "versionName='67.0'"

          PERMS="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Floating_Assistant_v67.0.apk)"
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          echo "$PERMS" | grep -q 'android.permission.FOREGROUND_SERVICE'
          ! echo "$PERMS" | grep -q 'android.permission.CAMERA'
          ! echo "$PERMS" | grep -q 'android.permission.RECORD_AUDIO'
          ! echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Floating_Assistant_v67.0.apk
          sha256sum Galaxy_AI_Floating_Assistant_v67.0.apk | tee Galaxy_AI_Floating_Assistant_v67.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Floating_Assistant_v67.0
          path: |
            Galaxy_AI_Floating_Assistant_v67.0.apk
            Galaxy_AI_Floating_Assistant_v67.0.sha256
          if-no-files-found: error
          retention-days: 30
