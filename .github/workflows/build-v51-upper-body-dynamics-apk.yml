name: Build Galaxy AI Fold7 v51.0 Upper Body Dynamics APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v51-upper-body-dynamics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v51 upper body dynamics and inherited AI contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          body = Path('app/src/main/java/pro/galaxyai/fold7/engine/UpperBodyDynamicsV51.java').read_text()
          idle = Path('app/src/main/java/pro/galaxyai/fold7/engine/ContextualIdlePresenceV50.java').read_text()
          avatar = Path('app/src/main/java/pro/galaxyai/fold7/engine/DeformableLivePortraitV45.java').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/GalaxyAIWallpaperService.java').read_text()
          activity = Path('app/src/main/java/pro/galaxyai/fold7/MainActivity.java').read_text()
          personality = Path('app/src/main/java/pro/galaxyai/fold7/ai/RussianAIPersonalityV33.java').read_text()
          state = Path('app/src/main/java/pro/galaxyai/fold7/ai/AIState.java').read_text()
          fallback = Path('app/src/main/java/pro/galaxyai/fold7/ai/LocalFallbackAI.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          for token in ['Upper Body Dynamics', 'getShoulderLiftLeft()', 'getShoulderLiftRight()', 'getShoulderSpread()', 'getNeckCounterX()', 'getNeckCounterY()']:
              assert token in body, token
          for token in ['new UpperBodyDynamicsV51()', 'upperBody.update(decision, speaking, dt)', 'upperBody.getShoulderSpread()', 'upperBody.getNeckCounterX()']:
              assert token in idle, token
          for token in ['drawBitmapMesh', 'new AttentionGazeControllerV46()', 'new MicroExpressionControllerV47()']:
              assert token in avatar, token
          for forbidden in ['android.permission.CAMERA', 'android.permission.RECORD_AUDIO', 'android.permission.ACCESS_FINE_LOCATION']:
              assert forbidden not in manifest, forbidden
          assert 'idlePresence.update(decision, speaking, deltaSeconds)' in service
          assert 'v51 — Живая осанка и дыхание' in activity
          assert 'Камера' in activity and 'микрофон' in activity
          assert 'LOCALE_TAG = "ru-RU"' in personality
          assert 'LANGUAGE = "ru"' in personality
          for token in ['"locale"', 'RussianAIPersonalityV33.LOCALE_TAG', '"language"']:
              assert token in state, token
          assert 'local-fallback' in fallback
          assert "versionCode 510" in gradle
          assert "versionName '51.0'" in gradle
          assert 'Galaxy AI Fold7 v51' in manifest
          PY

      - name: Reconstruct and verify inherited photoreal portrait
        run: |
          cat \
            app/src/main/res/raw/ai_avatar_v36_1.txt \
            app/src/main/res/raw/ai_avatar_v36_2.txt \
            app/src/main/res/raw/ai_avatar_v36_3.txt \
            app/src/main/res/raw/ai_avatar_v36_4.txt \
            | base64 -d > /tmp/ai_avatar_v36.webp
          test -s /tmp/ai_avatar_v36.webp
          echo "752d82f39826a77a8dd1eec72041a8a8aaa8ae559eb5f6381c8068135a64e133  /tmp/ai_avatar_v36.webp" | sha256sum -c -
          file /tmp/ai_avatar_v36.webp

      - name: Verify inherited AIDI gateway stack compiles
        run: python3 -m py_compile aidi_gateway/*.py gateway_simulator/*.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v51.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify v51 APK metadata, permissions and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='510'"
          echo "$BADGING" | grep -q "versionName='51.0'"
          PERMS="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk)"
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          ! echo "$PERMS" | grep -q 'android.permission.CAMERA'
          ! echo "$PERMS" | grep -q 'android.permission.RECORD_AUDIO'
          ! echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk | tee Galaxy_AI_Fold7_LiveWallpaper_v51.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v51.0
          path: |
            Galaxy_AI_Fold7_LiveWallpaper_v51.0.apk
            Galaxy_AI_Fold7_LiveWallpaper_v51.0.sha256
          if-no-files-found: error
          retention-days: 30
