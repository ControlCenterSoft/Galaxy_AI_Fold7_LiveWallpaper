name: Build Galaxy AI v65.0 Floating Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v65-floating-ai-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v65 floating assistant contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          activity = Path('app/src/main/java/pro/galaxyai/fold7/MainActivity.java').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/FloatingAssistantService.java').read_text()
          view = Path('app/src/main/java/pro/galaxyai/fold7/FloatingAssistantViewV65.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          state = Path('app/src/main/java/pro/galaxyai/fold7/ai/AIState.java').read_text()
          personality = Path('app/src/main/java/pro/galaxyai/fold7/ai/RussianAIPersonalityV33.java').read_text()

          assert 'android.permission.SYSTEM_ALERT_WINDOW' in manifest
          assert 'android.permission.FOREGROUND_SERVICE' in manifest
          assert 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' in manifest
          assert 'android:foregroundServiceType="specialUse"' in manifest
          assert 'FloatingAssistantService' in manifest

          assert 'BIND_WALLPAPER' not in manifest
          assert 'android.software.live_wallpaper' not in manifest
          assert 'GalaxyAIWallpaperService' not in manifest

          assert 'ACTION_MANAGE_OVERLAY_PERMISSION' in activity
          assert 'Запустить AI-помощника' in activity
          assert 'Выбрать обычное фото / фон' in activity
          assert 'Живые обои больше не используются' in activity

          assert 'TYPE_APPLICATION_OVERLAY' in service
          assert 'START_STICKY' in service
          assert '148' in service and '222' in service
          assert 'DeformableLivePortraitV45' in view
          assert 'SpeechFaceSyncV41' in view
          assert 'portrait.setMouthOpen' in view
          assert 'portrait.update' in view
          assert 'reactToTap' in view

          assert '"locale"' in state
          assert 'RussianAIPersonalityV33.LOCALE_TAG' in state
          assert '"language"' in state
          assert 'LOCALE_TAG = "ru-RU"' in personality

          assert "versionCode 650" in gradle
          assert "versionName '65.0'" in gradle

          for forbidden in [
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.ACCESS_FINE_LOCATION'
          ]:
              assert forbidden not in manifest, forbidden
          PY

      - name: Verify inherited AIDI gateway stack compiles
        run: python3 -m py_compile aidi_gateway/*.py gateway_simulator/*.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v65.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify v65 APK metadata, permissions and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Floating_Assistant_v65.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Floating_Assistant_v65.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='650'"
          echo "$BADGING" | grep -q "versionName='65.0'"

          PERMS="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Floating_Assistant_v65.0.apk)"
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          echo "$PERMS" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          echo "$PERMS" | grep -q 'android.permission.FOREGROUND_SERVICE'
          ! echo "$PERMS" | grep -q 'android.permission.CAMERA'
          ! echo "$PERMS" | grep -q 'android.permission.RECORD_AUDIO'
          ! echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Floating_Assistant_v65.0.apk
          sha256sum Galaxy_AI_Floating_Assistant_v65.0.apk | tee Galaxy_AI_Floating_Assistant_v65.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Floating_Assistant_v65.0
          path: |
            Galaxy_AI_Floating_Assistant_v65.0.apk
            Galaxy_AI_Floating_Assistant_v65.0.sha256
          if-no-files-found: error
          retention-days: 30
