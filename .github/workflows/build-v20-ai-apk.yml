name: Build Galaxy AI Fold7 v20.0 AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v20-ai-living-universe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Android AIDI state exchange contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          state = Path('app/src/main/java/pro/galaxyai/fold7/ai/AIState.java').read_text()
          client = Path('app/src/main/java/pro/galaxyai/fold7/ai/HttpAIDIGatewayTransport.java').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/GalaxyAIWallpaperService.java').read_text()
          for token in ['captured_at_ms', 'state_sequence', 'display', 'width_px', 'height_px']:
              assert token in state, token
          for token in ['X-AIDI-Request-Id', 'request_id', 'X-AIDI-Protocol']:
              assert token in client, token
          assert 'aidi.needsRefresh()' in service
          assert 'stateCollector.capture(' in service
          PY

      - name: Test AIDI Gateway Simulator and Scene Decision contract
        run: python3 gateway_simulator/test_scene_protocol.py

      - name: Smoke test standalone AIDI Gateway Simulator
        run: |
          python3 gateway_simulator/aidi_gateway_simulator.py --host 127.0.0.1 --port 8765 > /tmp/aidi-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill $GATEWAY_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/health >/tmp/aidi-health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/aidi-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/aidi-health.json').read_text())
          assert body['status'] == 'ok'
          assert body['protocol'] == 'scene-v1'
          assert body['service'] == 'aidi-gateway-simulator'
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v20.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify AI APK metadata, permission and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='200'"
          echo "$BADGING" | grep -q "versionName='20.0'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk | grep -q 'android.permission.INTERNET'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v20.0
          path: Galaxy_AI_Fold7_LiveWallpaper_v20.0.apk
          if-no-files-found: error
          retention-days: 30
