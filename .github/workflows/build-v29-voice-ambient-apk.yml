name: Build Galaxy AI Fold7 v29.0 Voice Ambient APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v29-voice-ambient-personality

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v29 voice privacy source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          voice = Path('app/src/main/java/pro/galaxyai/fold7/engine/AmbientPersonalityControllerV29.java').read_text()
          activity = Path('app/src/main/java/pro/galaxyai/fold7/MainActivity.java').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/GalaxyAIWallpaperService.java').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          for token in ['TextToSpeech', 'voice_enabled', 'LEVEL_QUIET', 'LEVEL_NORMAL', 'LEVEL_EXPRESSIVE', 'maybeReact']:
              assert token in voice, token
          assert 'setVoiceEnabled' in activity
          assert 'setReactionLevel' in activity
          assert 'AmbientPersonalityControllerV29' in service
          assert 'ambientPersonality.maybeReact' in service
          assert 'android.intent.action.TTS_SERVICE' in manifest
          assert 'android.permission.RECORD_AUDIO' not in manifest
          assert "versionCode 290" in gradle
          assert "versionName '29.0'" in gradle
          assert 'Galaxy AI Fold7 v29' in manifest
          PY

      - name: Verify inherited AIDI remains healthy
        env:
          PYTHONPATH: aidi_gateway
          AIDI_GATEWAY_HOST: 127.0.0.1
          AIDI_GATEWAY_PORT: '8774'
          AIDI_QDRANT_URL: ''
          AIDI_OLLAMA_URL: http://127.0.0.1:9/api/chat
          AIDI_CLOUD_ENABLED: '0'
        run: |
          python3 -m py_compile aidi_gateway/*.py
          python3 aidi_gateway/server.py >/tmp/aidi-v29.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8774/health >/tmp/aidi-v29-health.json; then break; fi
            sleep 0.2
          done
          curl -fsS -o /tmp/aidi-v29-response.json \
            -X POST http://127.0.0.1:8774/api/v1/scene/analyze \
            -H 'Content-Type: application/json' \
            -H 'X-AIDI-Protocol: scene-v1' \
            -H 'X-AIDI-Request-Id: ci-v29-voice-1' \
            -d '{"device":"GalaxyFold7-ci","app_version":"29.0","request_id":"ci-v29-voice-1","state":{"battery":68,"charging":false,"fold_state":"cover","hour":21,"motion_level":0.08},"profile":{"schema":"profile-v2","samples":18},"context":{"schema":"context-v1","light":"dim","confidence":0.8,"source":"ci","raw_media":false}}'
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/aidi-v29-response.json').read_text())
          assert body['request_id'] == 'ci-v29-voice-1'
          assert body['avatar']['emotion'] in {'calm','focused','thinking','happy','sleep'}
          assert body['autonomy']['raw_media'] is False
          assert body['provenance']['schema'] == 'provenance-v1'
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v29.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Voice Ambient APK metadata, permissions and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='290'"
          echo "$BADGING" | grep -q "versionName='29.0'"
          PERMS="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk)"
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          ! echo "$PERMS" | grep -q 'android.permission.CAMERA'
          ! echo "$PERMS" | grep -q 'android.permission.RECORD_AUDIO'
          ! echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk | tee Galaxy_AI_Fold7_LiveWallpaper_v29.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v29.0
          path: |
            Galaxy_AI_Fold7_LiveWallpaper_v29.0.apk
            Galaxy_AI_Fold7_LiveWallpaper_v29.0.sha256
          if-no-files-found: error
          retention-days: 30
