name: Build Galaxy AI Fold7 v6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v6-ai-premium

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build v6
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v6.0.apk
          apksigner verify Galaxy_AI_Fold7_LiveWallpaper_v6.0.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v6.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v6.0
          path: Galaxy_AI_Fold7_LiveWallpaper_v6.0.apk
