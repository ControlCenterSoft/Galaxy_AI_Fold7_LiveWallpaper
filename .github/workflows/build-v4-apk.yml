name: Build Galaxy AI Fold7 v4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Galaxy_AI_Fold7_LiveWallpaper_v4.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v4.apk | tee Galaxy_AI_Fold7_LiveWallpaper_v4.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v4
          path: |
            Galaxy_AI_Fold7_LiveWallpaper_v4.apk
            Galaxy_AI_Fold7_LiveWallpaper_v4.apk.sha256
          if-no-files-found: error
          retention-days: 7
