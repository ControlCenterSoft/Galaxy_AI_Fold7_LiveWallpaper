name: Build Galaxy AI Fold7 v5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v5 APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Galaxy_AI_Fold7_LiveWallpaper_v5.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v5.apk | tee Galaxy_AI_Fold7_LiveWallpaper_v5.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v5
          path: |
            Galaxy_AI_Fold7_LiveWallpaper_v5.apk
            Galaxy_AI_Fold7_LiveWallpaper_v5.apk.sha256
          retention-days: 7
