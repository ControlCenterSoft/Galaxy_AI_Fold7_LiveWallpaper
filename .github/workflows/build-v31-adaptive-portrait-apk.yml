name: Build Galaxy AI Fold7 v31.0 Adaptive Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/v31-adaptive-portrait-presence

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify v31 portrait and privacy contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('app/src/main/java/pro/galaxyai/fold7/engine/AIAvatarRendererV31.java').read_text()
          service = Path('app/src/main/java/pro/galaxyai/fold7/GalaxyAIWallpaperService.java').read_text()
          activity = Path('app/src/main/java/pro/galaxyai/fold7/MainActivity.java').read_text()
          personal = Path('app/src/main/java/pro/galaxyai/fold7/ai/AIPersonalizationProfileV30.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          plan = Path('V31_ADAPTIVE_PORTRAIT_PRESENCE_PLAN.md').read_text()
          for token in ['drawCheekAndTempleLight', 'drawNeckAndEars', 'drawChinLight', 'drawEye', 'warmed', 'normalizeEmotion']:
              assert token in renderer, token
          for token in ['calm', 'focused', 'thinking', 'happy', 'sleep']:
              assert token in renderer, token
          assert 'AIAvatarRendererV31' in service
          assert 'V31Engine' in service
          assert 'personal, deltaSeconds, main' in service
          assert 'Adaptive Portrait Presence' in activity
          assert 'camera frames' in activity
          assert 'avatar-personalization-v1' in personal
          assert "versionCode 310" in gradle
          assert "versionName '31.0'" in gradle
          assert 'Galaxy AI Fold7 v31' in manifest
          assert 'android.permission.CAMERA' not in manifest
          assert 'android.permission.RECORD_AUDIO' not in manifest
          assert 'android.permission.ACCESS_FINE_LOCATION' not in manifest
          assert 'fully local' in plan
          PY

      - name: Verify inherited AIDI gateway stack compiles
        run: python3 -m py_compile aidi_gateway/*.py gateway_simulator/*.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v31.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Adaptive Portrait APK metadata, permissions and signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='310'"
          echo "$BADGING" | grep -q "versionName='31.0'"
          PERMS="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk)"
          echo "$PERMS"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          ! echo "$PERMS" | grep -q 'android.permission.CAMERA'
          ! echo "$PERMS" | grep -q 'android.permission.RECORD_AUDIO'
          ! echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk
          sha256sum Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk | tee Galaxy_AI_Fold7_LiveWallpaper_v31.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy_AI_Fold7_LiveWallpaper_v31.0
          path: |
            Galaxy_AI_Fold7_LiveWallpaper_v31.0.apk
            Galaxy_AI_Fold7_LiveWallpaper_v31.0.sha256
          if-no-files-found: error
          retention-days: 30
